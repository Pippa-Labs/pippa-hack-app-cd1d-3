manifest_version: 1

persistence: none

app_author_name: "Nightingale"

app:
  id: hack.app_cd1d_3
  name: Ride Radar
  version: 0.1.0
  summary: >-
    Predicts how easy it is to get an Uber, Bolt or taxi in London at a given
    time and date, with surge risk, wait estimate and whether the Night Tube
    is running. An estimate from time patterns and the Open-Meteo rain
    forecast, not live driver data.

agent_types:
  - personal

outcomes:
  - id: ride.availability
    summary: Estimate ride-hail car availability, surge and wait at a date and time, plus Night Tube status
    example_phrases:
      - will i get an uber at 2am saturday
      - how hard is it to get a cab
      - is uber surging on friday night
      - can i get a taxi home at 3am
      - will there be bolt drivers at midnight
      - how long to wait for an uber
      - is the night tube running saturday
      - will rides be expensive on new years eve
    inputs:
      - name: when
        type: string
        required: false
        description: >-
          The date and time the person wants a ride, converted to ISO like
          2026-11-21T23:30 using the message (a date with no time may be given
          as 2026-11-21). If the message names no date or time, return an empty
          string rather than guessing.
      - name: place
        type: string
        required: false
        description: >-
          The London area or place the ride starts from, if the person named
          one. Return an empty string rather than guessing.
    output:
      - name: when_used
        type: string
        description: The London date and time the estimate is for.
      - name: day
        type: string
        description: The day of the week.
      - name: demand_level
        type: string
        description: One of low, normal, busy, high, very high.
      - name: surge_likely
        type: boolean
      - name: wait_estimate
        type: string
        description: A rough wait for a car, in words.
      - name: night_tube_running
        type: boolean
      - name: tube_running
        type: boolean
        description: Whether the regular Tube service is likely running.
      - name: reasons
        type: array
        item_type: string
      - name: rain_chance_percent
        type: integer
        required: false
        description: Chance of rain that hour, when the forecast covers it.
      - name: apps_to_try
        type: array
        item_type: string
